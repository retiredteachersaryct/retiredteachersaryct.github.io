  <style>
    :root {
      --teal: #1c6e8c;
      --olive: #808034;
      --teal-light: #d3e9f0;
      --white: #ffffff;
      --text: #3a4a4f;
      --accent-link: #B5533C;
      --accent-warm: #8F6530;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--white);
      font-family: 'Poppins', sans-serif;
      color: var(--text);
    }

    .top-bar {
      background: var(--teal-light);
      padding: 0.9rem 1.5rem;
      text-align: center;
    }

    .top-bar a {
      color: var(--teal);
      text-decoration: none;
      font-weight: 600;
      margin: 0 0.75rem;
    }

    .top-bar a:hover {
      text-decoration: underline;
    }

    .gallery-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    .gallery-page h1 {
      font-family: 'Playfair Display', serif;
      color: var(--teal);
      font-size: clamp(1.8rem, 4.5vw, 2.5rem);
      text-align: center;
      margin: 0 0 0.5rem;
    }

    .gallery-page .subtitle {
      text-align: center;
      color: var(--accent-warm);
      font-weight: 600;
      margin: 0 0 2.5rem;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .photo-grid figure {
      margin: 0;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .photo-grid figure:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.18);
    }

    .photo-grid img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
    }

    .photo-grid figcaption {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      font-size: 0.8rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
    }

    .photo-grid figcaption > :first-child {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .photo-date {
      color: var(--accent-warm);
      font-size: 0.75rem;
      font-weight: 600;
      flex-shrink: 0;
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      cursor: zoom-out;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: default;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      border-radius: 0;
    }

    .lightbox-caption {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      padding: 0.5rem 1.25rem;
      border-radius: 999px;
      font-size: 0.9rem;
      white-space: nowrap;
      cursor: default;
    }

    .lightbox-close {
      position: fixed;
      top: 1.25rem;
      right: 1.5rem;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 1.75rem;
      line-height: 1;
      cursor: pointer;
      z-index: 1001;
    }

    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 56px;
      height: 56px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
      z-index: 1001;
    }

    .lightbox-nav:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .lightbox-prev {
      left: 1.25rem;
    }

    .lightbox-next {
      right: 1.25rem;
    }

    @media (max-width: 480px) {
      .lightbox-nav {
        width: 44px;
        height: 44px;
        font-size: 1.5rem;
      }
    }

    @media (max-width: 480px) {
      .photo-grid {
        grid-template-columns: 1fr 1fr;
      }
      .photo-grid img {
        height: 160px;
      }
    }
  </style>
</head>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" aria-label="Close" onclick="closeLightbox()">&times;</button>
    <button class="lightbox-nav lightbox-prev" aria-label="Previous photo" onclick="event.stopPropagation(); showOffset(-1)">&#10094;</button>
    <button class="lightbox-nav lightbox-next" aria-label="Next photo" onclick="event.stopPropagation(); showOffset(1)">&#10095;</button>
    <img id="lightbox-img" src="" alt="">
    <div id="lightbox-caption" class="lightbox-caption"></div>
  </div>

  <script>
    const galleryPhotos = Array.from(document.querySelectorAll('.photo-grid img'));
    let currentPhotoIndex = -1;

    function openLightbox(imgEl) {
      currentPhotoIndex = galleryPhotos.indexOf(imgEl);
      showPhoto(currentPhotoIndex);
      document.getElementById('lightbox').classList.add('open');
    }

    function showPhoto(index) {
      const imgEl = galleryPhotos[index];
      const lightboxImg = document.getElementById('lightbox-img');
      lightboxImg.src = imgEl.src;
      lightboxImg.alt = imgEl.alt;
      document.getElementById('lightbox-caption').textContent = imgEl.dataset.caption || '';
    }

    function showOffset(offset) {
      if (currentPhotoIndex === -1) return;
      currentPhotoIndex = (currentPhotoIndex + offset + galleryPhotos.length) % galleryPhotos.length;
      showPhoto(currentPhotoIndex);
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    document.addEventListener('keydown', function (e) {
      if (!document.getElementById('lightbox').classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') showOffset(-1);
      if (e.key === 'ArrowRight') showOffset(1);
    });
  </script>
