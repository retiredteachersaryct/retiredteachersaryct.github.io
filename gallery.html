<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery — ARYCT</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="images/favicon-32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="images/favicon-16.png" sizes="16x16">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --plum: #723480;
      --olive: #808034;
      --lavender: #dbd4ff;
      --cream: #fffee3;
      --text: #4a3552;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cream);
      font-family: 'Poppins', sans-serif;
      color: var(--text);
    }

    .top-bar {
      background: var(--lavender);
      padding: 0.9rem 1.5rem;
      text-align: center;
    }

    .top-bar a {
      color: var(--plum);
      text-decoration: none;
      font-weight: 600;
      margin: 0 0.75rem;
    }

    .top-bar a:hover {
      text-decoration: underline;
    }

    .gallery-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    .gallery-page h1 {
      font-family: 'Playfair Display', serif;
      color: var(--plum);
      font-size: clamp(1.8rem, 4.5vw, 2.5rem);
      text-align: center;
      margin: 0 0 0.5rem;
    }

    .gallery-page .subtitle {
      text-align: center;
      color: var(--olive);
      font-weight: 600;
      margin: 0 0 2.5rem;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .photo-grid img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      cursor: zoom-in;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .photo-grid img:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.18);
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      cursor: zoom-out;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: default;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      border-radius: 0;
    }

    .lightbox-close {
      position: fixed;
      top: 1.25rem;
      right: 1.5rem;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 1.75rem;
      line-height: 1;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      .photo-grid {
        grid-template-columns: 1fr 1fr;
      }
      .photo-grid img {
        height: 160px;
      }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html">&larr; Home</a>
  </div>

  <div class="gallery-page">
    <h1>Photo Gallery</h1>
    <p class="subtitle">Moments from our lunches, outings, and get-togethers</p>

    <div class="photo-grid">
      <img src="images/photo3.jpg" alt="Group photo of retired teachers at a gathering" onclick="openLightbox(this)">
      <img src="images/photo1.jpg" alt="Retired teachers at a restaurant celebration" onclick="openLightbox(this)">
      <img src="images/photo2.jpg" alt="Retired teachers at the Neil Diamond Musical" onclick="openLightbox(this)">
      <img src="images/gallery/silent-auction-1.jpeg" alt="Members with silent auction gift baskets" onclick="openLightbox(this)">
      <img src="images/gallery/silent-auction-2.jpeg" alt="Members holding silent auction gift baskets by the Christmas trees" onclick="openLightbox(this)">
      <img src="images/gallery/st-patricks-lunch-1.jpeg" alt="Members celebrating St. Patrick's Day lunch" onclick="openLightbox(this)">
      <img src="images/gallery/st-patricks-lunch-2.jpeg" alt="Larger group at the St. Patrick's Day lunch" onclick="openLightbox(this)">
      <img src="images/gallery/snack-volunteers.jpeg" alt="ARYCT volunteers preparing snacks" onclick="openLightbox(this)">
    </div>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" aria-label="Close" onclick="closeLightbox()">&times;</button>
    <img id="lightbox-img" src="" alt="">
  </div>

  <script>
    function openLightbox(imgEl) {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      lightboxImg.src = imgEl.src;
      lightboxImg.alt = imgEl.alt;
      lightbox.classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
