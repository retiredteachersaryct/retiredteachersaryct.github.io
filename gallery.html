<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->

  <script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery — ARYCT</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="images/favicon-32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="images/favicon-16.png" sizes="16x16">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #1c6e8c;
      --olive: #808034;
      --teal-light: #d3e9f0;
      --white: #ffffff;
      --text: #3a4a4f;
      --accent-link: #B5533C;
      --accent-warm: #8F6530;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--white);
      font-family: 'Poppins', sans-serif;
      color: var(--text);
    }

    .top-bar {
      background: var(--teal-light);
      padding: 0.9rem 1.5rem;
      text-align: center;
    }

    .top-bar a {
      color: var(--teal);
      text-decoration: none;
      font-weight: 600;
      margin: 0 0.75rem;
    }

    .top-bar a:hover {
      text-decoration: underline;
    }

    .gallery-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    .gallery-page h1 {
      font-family: 'Playfair Display', serif;
      color: var(--teal);
      font-size: clamp(1.8rem, 4.5vw, 2.5rem);
      text-align: center;
      margin: 0 0 0.5rem;
    }

    .gallery-page .subtitle {
      text-align: center;
      color: var(--accent-warm);
      font-weight: 600;
      margin: 0 0 2.5rem;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .photo-grid img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      cursor: zoom-in;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .photo-grid img:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.18);
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      cursor: zoom-out;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: default;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      border-radius: 0;
    }

    .lightbox-close {
      position: fixed;
      top: 1.25rem;
      right: 1.5rem;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 1.75rem;
      line-height: 1;
      cursor: pointer;
      z-index: 1001;
    }

    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 56px;
      height: 56px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
      z-index: 1001;
    }

    .lightbox-nav:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .lightbox-prev {
      left: 1.25rem;
    }

    .lightbox-next {
      right: 1.25rem;
    }

    @media (max-width: 480px) {
      .lightbox-nav {
        width: 44px;
        height: 44px;
        font-size: 1.5rem;
      }
    }

    @media (max-width: 480px) {
      .photo-grid {
        grid-template-columns: 1fr 1fr;
      }
      .photo-grid img {
        height: 160px;
      }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html">&larr; Home</a>
  </div>

  <div class="gallery-page">
    <h1>Photo Gallery</h1>
    <p class="subtitle">Moments from our lunches, outings, and get-togethers</p>

    <div class="photo-grid">
      <img src="images/photo3.jpg" alt="Group photo of retired teachers at a gathering" onclick="openLightbox(this)">
      <img src="images/photo1.jpg" alt="Retired teachers at a restaurant celebration" onclick="openLightbox(this)">
      <img src="images/photo2.jpg" alt="Retired teachers at the Neil Diamond Musical" onclick="openLightbox(this)">
      <img src="images/gallery/silent-auction-1.jpeg" alt="Members with silent auction gift baskets" onclick="openLightbox(this)">
      <img src="images/gallery/silent-auction-2.jpeg" alt="Members holding silent auction gift baskets by the Christmas trees" onclick="openLightbox(this)">
      <img src="images/gallery/st-patricks-lunch-1.jpeg" alt="Members celebrating St. Patrick's Day lunch" onclick="openLightbox(this)">
      <img src="images/gallery/st-patricks-lunch-2.jpeg" alt="Larger group at the St. Patrick's Day lunch" onclick="openLightbox(this)">
      <img src="images/gallery/snack-volunteers.jpeg" alt="ARYCT volunteers preparing snacks" onclick="openLightbox(this)">
      <img src="images/gallery/memorial-tribute-singers.jpg" alt="Members singing at a Days of Mourning memorial tribute" onclick="openLightbox(this)">
      <img src="images/gallery/memorial-tribute-group.jpg" alt="Group at the Days of Mourning memorial" onclick="openLightbox(this)">
      <img src="images/gallery/canadian-library-project.jpg" alt="The Canadian Library Project display at Royal Rose Gallery" onclick="openLightbox(this)">
      <img src="images/gallery/irish-pub-band.jpg" alt="Live band at the Irish Pub outing, Market Brewing Co." onclick="openLightbox(this)">
      <img src="images/gallery/baking-volunteers.jpg" alt="Members packing baked treats for a donation drive" onclick="openLightbox(this)">
      <img src="images/gallery/euchre-cards.jpg" alt="Members playing cards at an outdoor pavilion" onclick="openLightbox(this)">
      <img src="images/gallery/pottageville-group.jpg" alt="Group photo at the Pottageville pavilion" onclick="openLightbox(this)">
      <img src="images/gallery/canadian-library-journals.jpg" alt="Members with journals from the Canadian Library project" onclick="openLightbox(this)">
      <img src="images/gallery/christmas-packages.jpg" alt="Members packing Christmas gift packages" onclick="openLightbox(this)">
      <img src="images/gallery/cnoy-2022.jpg" alt="Coldest Night of the Year 2022 fundraising walk" onclick="openLightbox(this)">
      <img src="images/gallery/royal-rose-craft-sale.jpg" alt="Members selling comfort dolls at the Royal Rose Gallery craft sale" onclick="openLightbox(this)">
      <img src="images/gallery/remembrance-craft-sale.jpg" alt="Members at a Remembrance Day craft sale table" onclick="openLightbox(this)">
      <img src="images/gallery/family-assistance-outreach.jpg" alt="Members with the City Street Outreach truck" onclick="openLightbox(this)">
      <img src="images/gallery/indigenous-awareness-circle.jpg" alt="Members gathered for an Indigenous Awareness event" onclick="openLightbox(this)">
      <img src="images/gallery/garden-tour-group.jpg" alt="Members at a garden tour outing" onclick="openLightbox(this)">
      <img src="images/gallery/mandarin-lunch.jpg" alt="Members at a group lunch at Mandarin" onclick="openLightbox(this)">
      <img src="images/gallery/painting-class.jpg" alt="Members showing their paintings from a paint night class" onclick="openLightbox(this)">
      <img src="images/gallery/refugee-presentation.jpg" alt="Members at a refugee presentation" onclick="openLightbox(this)">
      <img src="images/gallery/sandwich-prep.jpg" alt="Members preparing sandwiches and pastries for donation" onclick="openLightbox(this)">
      <img src="images/gallery/sandwiches-milk-bags-delivery.jpg" alt="Members delivering sandwiches and milk bag mats to City Street Outreach" onclick="openLightbox(this)">
      <img src="images/gallery/weavers-group.jpg" alt="Milk bag weavers group with finished sleeping mats" onclick="openLightbox(this)">
      <img src="images/gallery/weaving-at-school.jpg" alt="Milk bag weaving demonstration at a school" onclick="openLightbox(this)">
    </div>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" aria-label="Close" onclick="closeLightbox()">&times;</button>
    <button class="lightbox-nav lightbox-prev" aria-label="Previous photo" onclick="event.stopPropagation(); showOffset(-1)">&#10094;</button>
    <button class="lightbox-nav lightbox-next" aria-label="Next photo" onclick="event.stopPropagation(); showOffset(1)">&#10095;</button>
    <img id="lightbox-img" src="" alt="">
  </div>

  <script>
    const galleryPhotos = Array.from(document.querySelectorAll('.photo-grid img'));
    let currentPhotoIndex = -1;

    function openLightbox(imgEl) {
      currentPhotoIndex = galleryPhotos.indexOf(imgEl);
      showPhoto(currentPhotoIndex);
      document.getElementById('lightbox').classList.add('open');
    }

    function showPhoto(index) {
      const imgEl = galleryPhotos[index];
      const lightboxImg = document.getElementById('lightbox-img');
      lightboxImg.src = imgEl.src;
      lightboxImg.alt = imgEl.alt;
    }

    function showOffset(offset) {
      if (currentPhotoIndex === -1) return;
      currentPhotoIndex = (currentPhotoIndex + offset + galleryPhotos.length) % galleryPhotos.length;
      showPhoto(currentPhotoIndex);
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    document.addEventListener('keydown', function (e) {
      if (!document.getElementById('lightbox').classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') showOffset(-1);
      if (e.key === 'ArrowRight') showOffset(1);
    });
  </script>
</body>
</html>
