<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Active Retired York Catholic Teachers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --maroon: #6b1f2e;
      --gold: #c9a24b;
      --cream: #fdf9f2;
      --text: #3d2b2b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #7a2436 0%, #4a1420 100%);
      font-family: 'Poppins', sans-serif;
      color: var(--text);
      padding: 2rem;
    }

    .card {
      background: var(--cream);
      border-radius: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
      padding: 3.5rem 3rem;
      max-width: 640px;
      width: 100%;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: linear-gradient(90deg, var(--maroon), var(--gold));
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: var(--maroon);
      font-size: clamp(1.8rem, 4.5vw, 2.75rem);
      margin: 0 0 1rem;
      letter-spacing: 0.5px;
    }

    .tagline {
      font-size: clamp(1rem, 2vw, 1.15rem);
      color: #6b5a5a;
      margin: 0 0 2.5rem;
      line-height: 1.6;
      font-weight: 400;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 1.25rem;
    }

    .social-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--maroon);
      color: #fff;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .social-links a:hover {
      background: var(--gold);
      transform: translateY(-4px);
    }

    .social-links svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Active Retired York Catholic Teachers</h1>
    <p class="tagline">We are retired York OECTA members who like to stay connected and involved.</p>

</html>
