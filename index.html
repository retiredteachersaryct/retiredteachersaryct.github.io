<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Active Retired York Catholic Teachers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --plum: #723480;
      --olive: #808034;
      --lavender: #dbd4ff;
      --cream: #fffee3;
      --text: #4a3552;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cream);
      font-family: 'Poppins', sans-serif;
      color: var(--text);
    }

    .banner {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr;
      gap: 4px;
      width: 100%;
      height: 220px;
    }

    @media (min-width: 700px) {
      .banner {
        height: 480px;
      }
    }

    .banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .banner img:first-child {
      grid-row: span 2;
      height: 100%;
    }

    .divider {
      height: 6px;
      background: var(--lavender);
    }

    .body-content {
      max-width: 720px;
      margin: 0 auto;
      padding: 3rem 2rem 3.5rem;
      text-align: center;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: var(--plum);
      font-size: clamp(1.8rem, 4.5vw, 2.75rem);
      margin: 0 0 1rem;
      letter-spacing: 0.5px;
    }

    .tagline {
      font-size: clamp(1rem, 2vw, 1.15rem);
      color: var(--olive);
      margin: 0 0 2.5rem;
      line-height: 1.6;
      font-weight: 500;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }

    .social-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 92px;
      height: 92px;
      padding: 10px;
      border-radius: 24px;
      background: #ffffff;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
    }

    .social-links a:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.22);
    }

    .social-links svg {
      width: 72px;
      height: 72px;
    }

    @media (max-width: 480px) {
      .banner {
        height: 150px;
      }
      .body-content {
        padding: 2rem 1.5rem 2.5rem;
      }
      .social-links a {
        width: 76px;
        height: 76px;
        padding: 8px;
      }
      .social-links svg {
        width: 60px;
        height: 60px;
      }
    }
  </style>
</head>
<body>
  <div class="banner">
    <img src="images/photo3.jpg" alt="Group photo of retired teachers at a gathering">
    <img src="images/photo1.jpg" alt="Retired teachers at a restaurant celebration">
    <img src="images/photo2.jpg" alt="Retired teachers at the Neil Diamond Musical">
  </div>
  <div class="divider"></div>
  <div class="body-content">
    <h1>Active Retired York Catholic Teachers</h1>
    <p class="tagline">We are retired York OECTA members who like to stay connected and involved.</p>
    <div class="social-links">
      <a href="https://www.facebook.com/groups/776941489656858" target="_blank" rel="noopener" aria-label="Facebook Group">
        <svg viewBox="0 0 216.53 216.53" xmlns="http://www.w3.org/2000/svg">
          <path fill="#1877F2" d="M216.53 108.26C216.53 48.48 168.05 0 108.26 0S0 48.48 0 108.26c0 54.02 39.58 98.78 91.32 106.9v-75.6H63.84v-31.3h27.48V85.32c0-27.14 16.16-42.13 40.92-42.13 11.86 0 24.26 2.12 24.26 2.12v26.67h-13.67c-13.47 0-17.67 8.36-17.67 16.94v20.34h30.08l-4.81 31.3h-25.27v75.6c51.74-8.12 91.32-52.88 91.32-106.9Z"/>
        </svg>
      </a>
      <a href="https://www.instagram.com/aryct11/" target="_blank" rel="noopener" aria-label="Instagram Page">
        <svg viewBox="0 0 448 448" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="igGradient" cx="30%" cy="107%" r="150%">
              <stop offset="0%" stop-color="#fdf497"/>
              <stop offset="5%" stop-color="#fdf497"/>
              <stop offset="45%" stop-color="#fd5949"/>
              <stop offset="60%" stop-color="#d6249f"/>
              <stop offset="90%" stop-color="#285AEB"/>
            </radialGradient>
          </defs>
          <rect width="448" height="448" rx="100" fill="url(#igGradient)"/>
          <rect x="124" y="124" width="200" height="200" rx="54" fill="none" stroke="#fff" stroke-width="26"/>
          <circle cx="224" cy="224" r="55" fill="none" stroke="#fff" stroke-width="26"/>
          <circle cx="337" cy="111" r="16" fill="#fff"/>
        </svg>
      </a>
    </div>
  </div>
</body>
</html>
